<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <!-- ✅ Theme color — يتطابق مع --bg-main في theme.css -->
    <meta name="theme-color" content="#0a0a14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="بلاك 🖤 - ذكاء اصطناعي متقدم" />

    <!-- Favicon -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖤</text></svg>"
    />

    <!-- ✅ Fonts — preconnect أولاً لتسريع التحميل -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>بلاك 🖤</title>

    <!--
      ✅ Critical CSS — يمنع الـ flash تماماً قبل تحميل theme.css
      الألوان هنا تطابق بالظبط --bg-main و --font-body في theme.css
      لو غيرت الألوان في theme.css — غيّرها هنا برضو
    -->
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0a14;
        color: #e8e8f0;
        font-family: 'IBM Plex Sans Arabic', 'Cairo', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      #root {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* ── Font variables مبكرة ── */
      :root {
        --font-heading: 'Cairo', 'IBM Plex Sans Arabic', system-ui, sans-serif;
        --font-body:    'IBM Plex Sans Arabic', 'Cairo', system-ui, sans-serif;
        --font-mono:    'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
      }
    </style>

    <!--
      ✅ Tesseract.js و pdf.js — تُحمَّل بـ defer
      بدل تحميلها بشكل blocking — بيسرع الـ initial load بشكل كبير
    -->
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"
    ></script>

    <script
      defer
      src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"
    ></script>

    <script>
      // ✅ ننتظر تحميل pdf.js قبل ما نضبط الـ worker
      window.addEventListener("load", function () {
        try {
          if (window["pdfjs-dist/build/pdf"]) {
            window.pdfjsLib = window["pdfjs-dist/build/pdf"];
            window.pdfjsLib.GlobalWorkerOptions.workerSrc =
              "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
          }
        } catch (e) {
          console.warn("pdf.js init:", e);
        }
      });
    </script>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
